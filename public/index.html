    function renderWeekChart(trades) {
      const chartContainer = document.getElementById('weekChartBars');
      if (!chartContainer) return;

      // Day names: Monday = 0, Sunday = 6
      const dayNames = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];
      const dayPnls = new Array(7).fill(0);

      // Calculate P&L for each day of week
      for (const trade of trades) {
        const parts = String(trade.date || '').split('/');
        if (parts.length !== 3) continue;

        const dd = parseInt(parts[0], 10);
        const mm = parseInt(parts[1], 10) - 1;
        const yy = parseInt(parts[2], 10);

        if (!Number.isInteger(dd) || !Number.isInteger(mm) || !Number.isInteger(yy)) continue;

        const dateObj = new Date(yy, mm, dd);
        // Convert JS getDay() (0=Sun, 6=Sat) to Monday-first (0=Mon, 6=Sun)
        const dayOfWeek = (dateObj.getDay() + 6) % 7;

        // pnl is now REAL (number) in database
        const pnlNum = (trade.pnl != null && trade.pnl !== '') ? (typeof trade.pnl === 'number' ? trade.pnl : parseFloat(String(trade.pnl).replace(',', '.'))) : null;
        if (pnlNum != null && Number.isFinite(pnlNum)) {
          dayPnls[dayOfWeek] += pnlNum;
        }
      }

      // Find max absolute value for scaling
      const absValues = dayPnls.map(v => Math.abs(v));
      const maxAbs = Math.max(...absValues, 1);

      // Render chart bars
      let html = '';

      dayPnls.forEach((pnl, index) => {
        const isPositive = pnl > 0.01;
        const isNegative = pnl < -0.01;
        const isZero = !isPositive && !isNegative;

        // Calculate height as percentage based on absolute value
        let heightPercent = 0;
        if (isZero) {
          heightPercent = 2; // Minimum visibility for zero
        } else {
          // Use absolute value to calculate height
          heightPercent = (Math.abs(pnl) / maxAbs) * 100;
          // Ensure minimum visibility
          if (heightPercent < 3) heightPercent = 3;
        }

        // All bars start from the same bottom position (50px for labels)
        const barClass = isZero ? '' : (isPositive ? 'positive' : 'negative');
        const valueClass = isZero ? '' : (isPositive ? 'positive' : 'negative');
        const sign = isPositive ? '+' : '';
        const displayValue = isZero ? '0$' : sign + (Math.round(pnl * 100) / 100) + '$';

        html += `
          <div class="chart-bar-container">
            <div class="chart-bar ${barClass}" style="--bar-height: ${heightPercent}%;">
              <div class="chart-bar-value ${valueClass}">${displayValue}</div>
            </div>
            <div class="chart-bar-label">${dayNames[index]}</div>
          </div>
        `;
      });

      chartContainer.innerHTML = html;
    }

    const toastContainer = document.getElementById('toastContainer');
    function showToast(message, opts = {}) {
      const id = 'toast_' + Date.now();
      const el = document.createElement('div');
      el.className = 'toast';
      if (opts.type === 'success') {
        el.classList.add('toast-success');
      } else if (opts.type === 'error') {
        el.classList.add('toast-error');
      }
      el.id = id;
      
      // Add icon based on type
      let iconHtml = '';
      if (opts.type === 'success') {
        iconHtml = `<div class="toast-icon"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M20 6L9 17l-5-5"/></svg></div>`;
      } else if (opts.type === 'error') {
        iconHtml = `<div class="toast-icon"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg></div>`;
      }
      
      el.innerHTML = `<div class="toast-msg">${iconHtml}${escapeHtml(message)}</div><button class="close-btn" aria-label="Close">×</button>`;
      el.querySelector('.close-btn').addEventListener('click', () => removeToast(el));
      toastContainer.appendChild(el);
      requestAnimationFrame(() => el.classList.add('show'));
      const duration = typeof opts.duration === 'number' ? opts.duration : 3500;
      const timer = setTimeout(() => removeToast(el), duration);
      el._timer = timer;
      return el;
    }
    function removeToast(el) {
      if (!el) return;
      if (el._timer) clearTimeout(el._timer);
      el.classList.remove('show');
      setTimeout(() => { if (el.parentNode) el.parentNode.removeChild(el); }, 300);
    }
    function escapeHtml(str) {
      return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#039;');
    }

    function updatePnlColor() {
      const pnlInput = document.getElementById('pnlInput');
      if (!pnlInput) return;
      
      const value = pnlInput.value.trim();
      if (!value) {
        pnlInput.classList.remove('pnl-positive', 'pnl-negative');
        pnlInput.classList.add('pnl-neutral');
        return;
      }
      
      // Try to parse the value
      const numValue = parseFloat(value.replace(',', '.'));
      if (isNaN(numValue)) {
        pnlInput.classList.remove('pnl-positive', 'pnl-negative');
        pnlInput.classList.add('pnl-neutral');
        return;
      }
      
      // Remove all classes first
      pnlInput.classList.remove('pnl-positive', 'pnl-negative', 'pnl-neutral');
      
      // Add appropriate class
      if (numValue > 0) {
        pnlInput.classList.add('pnl-positive');
      } else if (numValue < 0) {
        pnlInput.classList.add('pnl-negative');
      } else {
        pnlInput.classList.add('pnl-neutral');
      }
    }

            showLoginScreen();
            return;
          }
          throw new Error('Failed to load trade');

        // Convert date from DD/MM/YYYY to YYYY-MM-DD for input

    function closeNoteModal() {
      if (noteBackdrop) {
        noteBackdrop.classList.remove('show');
        noteBackdrop.classList.add('hiding');
        noteBackdrop.setAttribute('aria-hidden', 'true');
        setTimeout(() => {
          noteBackdrop.style.display = 'none';
          noteBackdrop.classList.remove('hiding');
          // Clear content after animation completes
          if (noteContent) noteContent.textContent = '';
        }, 400);
      } else {
        // If backdrop doesn't exist, clear content immediately
        if (noteContent) noteContent.textContent = '';
      }
    }
    if (noteCloseX) noteCloseX.addEventListener('click', closeNoteModal);
    if (noteCloseFooter) noteCloseFooter.addEventListener('click', closeNoteModal);

    function formatDateInputToDisplay(raw) {
      if (!raw) return '';
      const [y, m, d] = raw.split('-');
      return `${d}/${m}/${y}`;
    }

    function isValidTradingViewUrl(url) {
      if (!url) return true;
      try { const t = url.trim(); return t.startsWith(ALLOWED_PREFIX); } catch (e) { return false; }
    }

    function validateSymbol(sym) {
      if (typeof sym !== 'string') return { ok: false, reason: 'Symbol must be a string' };
      const s = sym.trim();
      if (s.length === 0) return { ok: false, reason: 'Symbol cannot be empty' };
      if (s.length > 10) return { ok: false, reason: 'Symbol can be up to 10 characters' };
      if (!/^[A-Za-z0-9._-]+$/.test(s)) return { ok: false, reason: 'Symbol may contain only letters, digits, . _ -' };
      return { ok: true, value: s.toUpperCase() };
    }

    function parseAndFormatRr(rrRaw) {
      if (rrRaw == null) return { ok: false, reason: 'RR is required' };
      const s = String(rrRaw).trim().replace(',', '.');
      if (s === '') return { ok: false, reason: 'RR is required' };
      const n = parseFloat(s);
      if (!Number.isFinite(n)) return { ok: false, reason: 'RR must be a number' };
      const rounded = Math.round(n * 100) / 100;
      return { ok: true, value: Number.isInteger(rounded) ? String(rounded) : rounded.toFixed(2) };
    }

    function parseAndValidatePnl(pnlRaw) {
      if (pnlRaw == null) return { ok: true, value: '' };
      const s = String(pnlRaw).trim();
      if (s === '') return { ok: true, value: '' };
      const cleaned = s.replace(',', '.').replace(/[^\d.-]/g, '');
      const n = parseFloat(cleaned);
      if (!Number.isFinite(n)) return { ok: false, reason: 'P&L must be a number' };
      if (n < -1000000 || n > 1000000) return { ok: false, reason: 'P&L must be between -1 000 000 and 1 000 000' };
      const out = Number.isInteger(n) ? String(n) : String(Math.round(n * 100) / 100);
      return { ok: true, value: out };
    }

    (function attachRrFilters() {
      const rrEl = document.getElementById('rrInput');
      if (!rrEl) return;
      rrEl.addEventListener('keydown', (e) => {
        const allowedKeys = ['Backspace', 'Delete', 'ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', 'Home', 'End', 'Tab'];
        if (allowedKeys.includes(e.key)) return;
        if (e.ctrlKey || e.metaKey) return;
        if (/^[0-9.,]$/.test(e.key)) return;
        e.preventDefault();
      });
      rrEl.addEventListener('input', () => {
        let v = rrEl.value || '';
        v = v.replace(',', '.');
        v = v.replace(/[^0-9.]/g, '');
        const firstDot = v.indexOf('.');
        if (firstDot !== -1) {
          const before = v.slice(0, firstDot + 1);
          let after = v.slice(firstDot + 1).replace(/\./g, '');
          after = after.slice(0, 2);
          v = before + after;
        }
        if (v.length > 1 && v[0] === '0' && v[1] !== '.') {
          v = v.replace(/^0+/, '');
          if (v === '') v = '0';
        }
        if (rrEl.value !== v) {
          const pos = rrEl.selectionStart || rrEl.value.length;
          rrEl.value = v;
          rrEl.setSelectionRange(Math.min(pos, v.length), Math.min(pos, v.length));
        }
      });
      rrEl.addEventListener('paste', (e) => {
        const text = (e.clipboardData || window.clipboardData).getData('text');
        if (!/^[0-9.,\s-]+$/.test(text)) { e.preventDefault(); }
      });
    })();

    (function attachSymbolUppercase() {
      const el = document.getElementById('symbolInput');
      if (!el) return;
      el.addEventListener('input', () => {
        const start = el.selectionStart;
        const end = el.selectionEnd;
        el.value = el.value.toUpperCase();
        el.setSelectionRange(start, end);
      });
    })();

    async function submitTrade() {
      // Prevent double submission
      if (isSubmittingTrade) return;
      
      const submitBtn = document.getElementById('submitTradeBtn');
      if (!submitBtn) return;
      
      // Disable button and show loading state
      isSubmittingTrade = true;
      submitBtn.disabled = true;
      const originalText = submitBtn.textContent;
      submitBtn.textContent = 'Saving...';
      
      const rawDateEl = document.getElementById('dateInput');
      const rawDate = rawDateEl ? rawDateEl.value : '';
      const symbolRaw = (document.getElementById('symbolInput') || {}).value || '';
      const type = (document.getElementById('typeInput') || {}).value || '';
      const rrRaw = (document.getElementById('rrInput') || {}).value || '';
      const result = (document.getElementById('resultInput') || {}).value || '';
      const pnlRaw = (document.getElementById('pnlInput') || {}).value || '';
      const screenshot = (document.getElementById('screenshotInput') || {}).value || '';
      const noteRaw = (document.getElementById('noteInput') || {}).value || '';

      if (!rawDate) { 
        customAlert('Please select a date.'); 
        rawDateEl && rawDateEl.focus(); 
        setTimeout(() => {
          isSubmittingTrade = false;
          submitBtn.disabled = false;
          submitBtn.textContent = originalText;
        }, 1200);
        return; 
      }

      const symCheck = validateSymbol(symbolRaw);
      if (!symCheck.ok) { 
        customAlert(symCheck.reason); 
        const el = document.getElementById('symbolInput'); 
        if (el) el.focus(); 
        setTimeout(() => {
          isSubmittingTrade = false;
          submitBtn.disabled = false;
          submitBtn.textContent = originalText;
        }, 1200);
        return; 
      }
      const symbol = symCheck.value;

      if (!type) { 
        customAlert('Select type (Long/Short).'); 
        const el = document.getElementById('typeInput'); 
        if (el) el.focus(); 
        setTimeout(() => {
          isSubmittingTrade = false;
          submitBtn.disabled = false;
          submitBtn.textContent = originalText;
        }, 1200);
        return; 
      }

      const rrCheck = parseAndFormatRr(rrRaw);
      if (!rrCheck.ok) { 
        customAlert(rrCheck.reason); 
        const el = document.getElementById('rrInput'); 
        if (el) el.focus(); 
        setTimeout(() => {
          isSubmittingTrade = false;
          submitBtn.disabled = false;
          submitBtn.textContent = originalText;
        }, 1200);
        return; 
      }
      const rr = rrCheck.value;

      if (!result) { 
        customAlert('Select result.'); 
        const el = document.getElementById('resultInput'); 
        if (el) el.focus(); 
        setTimeout(() => {
          isSubmittingTrade = false;
          submitBtn.disabled = false;
          submitBtn.textContent = originalText;
        }, 1200);
        return; 
      }

      const pnlCheck = parseAndValidatePnl(pnlRaw);
      if (!pnlCheck.ok) { 
        customAlert(pnlCheck.reason); 
        const el = document.getElementById('pnlInput'); 
        if (el) el.focus(); 
        setTimeout(() => {
          isSubmittingTrade = false;
          submitBtn.disabled = false;
          submitBtn.textContent = originalText;
        }, 1200);
        return; 
      }
      const pnl = pnlCheck.value;

      if (!isValidTradingViewUrl(screenshot)) { 
        customAlert('Link must start with: https://www.tradingview.com'); 
        const el = document.getElementById('screenshotInput'); 
        if (el) el.focus(); 
        setTimeout(() => {
          isSubmittingTrade = false;
          submitBtn.disabled = false;
          submitBtn.textContent = originalText;
        }, 1200);
        return; 
      }

      const note = String(noteRaw || '').trim().slice(0, 500);

      const payload = {
        date: formatDateInputToDisplay(rawDate),
        symbol: symbol,
        type: type,
        rr: rr,
        result: result,
        pnl: pnl,
        screenshot: screenshot,
        note: note
      };

      try {
        const url = editingTradeId ? `/trades/${editingTradeId}` : '/trades';
        const method = editingTradeId ? 'PUT' : 'POST';
        
        const res = await authFetch(url, {
          method: method,
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        if (!res.ok) throw new Error('Save error');
        closeAddModal();
        const route = location.pathname || '/trades';
        if (route === '/analytics') await renderAnalyticsView();
        else if (route === '/calendar') {
          const { year, month } = getCalendarState();
          renderCalendarView(year, month);
        } else await loadTrades();
        showToast(editingTradeId ? 'Trade updated successfully' : 'Trade added successfully', { duration: 3500, type: 'success' });
      } catch (e) {
        console.error(e);
        customAlert('Failed to save entry.');
      } finally {
        // Re-enable button after delay to prevent rapid double-clicks
        setTimeout(() => {
          isSubmittingTrade = false;
          if (submitBtn) {
            submitBtn.disabled = false;
            submitBtn.textContent = originalText;
          }
        }, 1500); // 1.5 second delay before re-enabling
      }
    }

    function handleScreenshotOpen(urlEnc) {
      const url = decodeURIComponent(urlEnc || '').trim();
      if (!url) { customAlert('No screenshot link.'); return; }
      if (!isValidTradingViewUrl(url)) { customAlert('Invalid link. It must start with: https://www.tradingview.com'); return; }
      try { window.open(url, '_blank', 'noopener'); } catch (e) { location.href = url; }
    }

    async function loadTrades() {
      // Don't try to load if not authenticated
      if (!currentUser || !authToken) {
        const tbody = document.getElementById('journalBody');
        if (tbody) {
          tbody.innerHTML = '';
        }
        return;
      }
      
      try {
        const res = await authFetch('/trades');
        if (!res.ok) {
          if (res.status === 401) {
            showLoginScreen();
            return;
          }
          throw new Error('Fetch error');
        }
        const data = await res.json();
        const tbody = document.getElementById('journalBody');
        if (!tbody) return;
        tbody.innerHTML = data.map(entry => {
          const symbol = entry.symbol || '-';
          const type = entry.type || '-';
          // rr and pnl are now REAL (numbers) in database, handle both number and null
          const rr = (entry.rr != null && entry.rr !== '') ? String(entry.rr) : '-';
          const result = entry.result || '-';
          const pnl = entry.pnl;
          const screenshot = (entry.screenshot || '').trim();
          const note = (entry.note || '').trim();

          let resultClass = '';
          if (/win/i.test(result)) resultClass = 'result-win';
          else if (/loss/i.test(result)) resultClass = 'result-loss';
          else resultClass = 'result-be';

          // pnl is now a number (REAL) or null
          const pnlNum = (pnl != null && pnl !== '') ? (typeof pnl === 'number' ? pnl : parseFloat(String(pnl).replace(',', '.'))) : null;
          let pnlClass = '';
          if (pnlNum !== null && Number.isFinite(pnlNum)) {
            if (pnlNum > 0) pnlClass = 'pnl-win';
            else if (pnlNum < 0) pnlClass = 'pnl-loss';
          }

          const sign = (pnlNum != null && Number.isFinite(pnlNum) && pnlNum > 0) ? '+' : '';
          const pnlDisplay = (pnlNum != null && Number.isFinite(pnlNum)) ? sign + pnlNum + '$' : '-';
          const urlEnc = encodeURIComponent(screenshot || '');
          const noteEnc = encodeURIComponent(note || '');
          const shotCell = screenshot ? `<button class="btn-edit shot-link" data-url="${urlEnc}" aria-label="Open screenshot">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
                <circle cx="12" cy="13" r="4"/>
              </svg>
              OPEN
            </button>` : '-';
          const noteCell = note ? `<button class="btn-edit note-link" data-note="${noteEnc}" aria-label="Open note">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                <polyline points="14 2 14 8 20 8"/>
                <line x1="16" y1="13" x2="8" y2="13"/>
                <line x1="16" y1="17" x2="8" y2="17"/>
                <polyline points="10 9 9 9 8 9"/>
              </svg>
              OPEN
            </button>` : '-';

          return `<tr>
        <td>${entry.date}</td>
        <td>${escapeHtml(symbol)}</td>
        <td>${escapeHtml(type)}</td>
        <td>${escapeHtml(rr)}</td>
        <td><span class="${resultClass}">${escapeHtml(result)}</span></td>
        <td class="${pnlClass}">${escapeHtml(pnlDisplay)}</td>
        <td>${shotCell}</td>
        <td>${noteCell}</td>
        <td>
          <div class="trade-actions">
            <button class="btn-edit edit-trade-btn" data-trade-id="${entry.id}" aria-label="Edit entry ${entry.id}">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
                <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
              </svg>
              Edit
            </button>
            <button class="btn-danger delete-trade-btn" data-trade-id="${entry.id}" aria-label="Delete entry ${entry.id}">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
                <line x1="10" y1="11" x2="10" y2="17"/>
                <line x1="14" y1="11" x2="14" y2="17"/>
              </svg>
              Delete
            </button>
          </div>
        </td>
      </tr>`;
        }).join('');
      } catch (e) {
        console.error(e);
        const tbody = document.getElementById('journalBody');
        if (tbody) {
          tbody.innerHTML = '<tr><td colspan="9" class="error-message">Failed to load entries. Please try again.</td></tr>';
        }
      }
    }

    async function deleteTrade(id) {
      const confirmed = await customConfirm('Delete this entry?', 'Delete Trade', true);
      if (!confirmed) return;
      try {
        const res = await authFetch(`/trades/${id}`, { method: 'DELETE' });
        if (!res.ok) {
          if (res.status === 401) {
            showLoginScreen();
            return;
          }
          throw new Error('Delete error');
        }
        const route = (location.pathname || '/');
        if (route === '/analytics') { await renderAnalyticsView(); }
        else if (route === '/calendar') {
          const { year, month } = getCalendarState();
          renderCalendarView(year, month);
        } else { await loadTrades(); }
        showToast('Trade deleted successfully', { duration: 3000, type: 'success' });
      } catch (e) {
        console.error(e);
        customAlert('Failed to delete the entry.');
      }
    }

    async function exportTradesToPDF() {
      if (!currentUser || !authToken) {
        showToast('Please log in to export trades', { duration: 3000 });
        return;
      }

      try {
        showToast('Generating PDF...', { duration: 2000 });
        
        const res = await authFetch('/trades');
        if (!res.ok) {
          if (res.status === 401) {
            showLoginScreen();
            return;
          }
          throw new Error('Fetch error');
        }
        const data = await res.json();

        if (!data || data.length === 0) {
          showToast('No trades to export', { duration: 3000 });
          return;
        }

        // Check if jsPDF is available
        if (typeof window.jspdf === 'undefined' && typeof window.jsPDF === 'undefined') {
          showToast('PDF library not loaded. Please refresh the page.', { duration: 4000 });
          return;
        }

        // jsPDF can be exposed in different ways depending on the CDN
        const jsPDF = window.jspdf?.jsPDF || window.jsPDF;
        if (!jsPDF) {
          showToast('PDF library not available. Please refresh the page.', { duration: 4000 });
          return;
        }
        const doc = new jsPDF('l', 'mm', 'a4'); // landscape orientation
        
        // Set up fonts and colors matching the website style
        // Using light theme colors: --text: #111827, --bg: #ffffff, --surface-2: #fafbfc, --border: #e1e8ed
        const pageWidth = doc.internal.pageSize.getWidth();
        const pageHeight = doc.internal.pageSize.getHeight();
        const margin = 20;
        const startY = 25;
        let yPos = startY;

        // Title - matching website style (black text on white, bold)
        doc.setFontSize(24);
        doc.setFont(undefined, 'bold');
        doc.setTextColor(17, 24, 39); // --text: #111827
        doc.text('TradeLog', margin, yPos);
        yPos += 8;

        // Subtitle
        doc.setFontSize(12);
        doc.setFont(undefined, 'normal');
        doc.setTextColor(107, 114, 128); // --text-dim: #6b7280
        const exportDate = new Date().toLocaleString('pl-PL', {
          year: 'numeric',
          month: '2-digit',
          day: '2-digit',
          hour: '2-digit',
          minute: '2-digit'
        });
        doc.text(`Trading History • Exported: ${exportDate}`, margin, yPos);
        yPos += 12;

        // Table headers - matching website style (--surface-2: #fafbfc, --text-dim: #6b7280)
        const headers = ['Date', 'Symbol', 'Type', 'RR', 'Result', 'P&L', 'Screenshot', 'Notes'];
        const colWidths = [25, 20, 18, 15, 20, 20, 30, 50];
        const headerHeight = 10;
        
        // Draw header background - matching --surface-2: #fafbfc
        doc.setFillColor(250, 251, 252);
        doc.rect(margin, yPos - 7, pageWidth - 2 * margin, headerHeight, 'F');
        
        // Draw header border bottom - matching --border: #e1e8ed
        doc.setDrawColor(225, 232, 237);
        doc.setLineWidth(0.5);
        doc.line(margin, yPos - 7 + headerHeight, pageWidth - margin, yPos - 7 + headerHeight);
        
        // Draw header text - matching website style (uppercase, small, dim color)
        doc.setFontSize(9);
        doc.setFont(undefined, 'bold');
        doc.setTextColor(107, 114, 128); // --text-dim: #6b7280
        let xPos = margin;
        headers.forEach((header, i) => {
          doc.text(header.toUpperCase(), xPos + 4, yPos);
          xPos += colWidths[i];
        });
        yPos += headerHeight + 2;

        // Table rows - matching website style
        doc.setFontSize(9);
        doc.setFont(undefined, 'normal');
        const rowHeight = 9;
        
        // Calculate available space for rows
        // First page: has title and subtitle, so less space
        // Subsequent pages: only header, so more space
        const firstPageHeaderSpace = yPos; // Current yPos after title, subtitle, and table header
        const subsequentPageHeaderSpace = startY + headerHeight + 2; // Just header on new page
        const bottomMargin = margin + 50; // Space for summary or bottom margin
        
        // Available height for rows
        const firstPageAvailableHeight = pageHeight - firstPageHeaderSpace - bottomMargin;
        const subsequentPageAvailableHeight = pageHeight - subsequentPageHeaderSpace - bottomMargin;
        
        // Max rows per page
        const maxRowsFirstPage = Math.floor(firstPageAvailableHeight / rowHeight);
        const maxRowsSubsequentPage = Math.floor(subsequentPageAvailableHeight / rowHeight);
        
        let currentPageRowCount = 0;
        let isFirstPage = true;

        data.forEach((entry, index) => {
          // Check if we need a new page before drawing the row
          const maxRowsForCurrentPage = isFirstPage ? maxRowsFirstPage : maxRowsSubsequentPage;
          
          if (currentPageRowCount >= maxRowsForCurrentPage) {
            // Add new page
            doc.addPage();
            isFirstPage = false;
            currentPageRowCount = 0;
            yPos = startY;
            
            // Redraw header on new page
            doc.setFillColor(250, 251, 252);
            doc.rect(margin, yPos - 7, pageWidth - 2 * margin, headerHeight, 'F');
            doc.setDrawColor(225, 232, 237);
            doc.setLineWidth(0.5);
            doc.line(margin, yPos - 7 + headerHeight, pageWidth - margin, yPos - 7 + headerHeight);
            doc.setFontSize(9);
            doc.setFont(undefined, 'bold');
            doc.setTextColor(107, 114, 128);
            xPos = margin;
            headers.forEach((header, i) => {
              doc.text(header.toUpperCase(), xPos + 4, yPos);
              xPos += colWidths[i];
            });
            yPos += headerHeight + 2;
            doc.setFontSize(9);
            doc.setFont(undefined, 'normal');
          }

          // Prepare row data
          const symbol = entry.symbol || '-';
          const type = entry.type || '-';
          const rr = (entry.rr != null && entry.rr !== '') ? String(entry.rr) : '-';
          const result = entry.result || '-';
          const pnl = entry.pnl;
          const pnlNum = (pnl != null && pnl !== '') ? (typeof pnl === 'number' ? pnl : parseFloat(String(pnl).replace(',', '.'))) : null;
          const sign = (pnlNum != null && Number.isFinite(pnlNum) && pnlNum > 0) ? '+' : '';
          const pnlDisplay = (pnlNum != null && Number.isFinite(pnlNum)) ? sign + pnlNum.toFixed(2) + '$' : '-';
          const screenshot = (entry.screenshot || '').trim();
          const screenshotDisplay = screenshot ? 'Yes' : '-';
          const note = (entry.note || '').trim();
          const noteDisplay = note ? (note.length > 35 ? note.substring(0, 35) + '...' : note) : '-';

          const rowData = [
            entry.date || '-',
            symbol,
            type,
            rr,
            result,
            pnlDisplay,
            screenshotDisplay,
            noteDisplay
          ];

          // Hover effect background on hover rows (subtle)
          if (index % 2 === 1) {
            doc.setFillColor(250, 251, 252); // --surface-2: #fafbfc
            doc.rect(margin, yPos - 6, pageWidth - 2 * margin, rowHeight, 'F');
          }

          // Draw row border bottom - matching --border: #e1e8ed
          doc.setDrawColor(225, 232, 237);
          doc.setLineWidth(0.2);
          doc.line(margin, yPos - 6 + rowHeight, pageWidth - margin, yPos - 6 + rowHeight);

          // Set text color - default to --text: #111827
          doc.setTextColor(17, 24, 39);

          // Draw row cells
          xPos = margin;
          rowData.forEach((cell, i) => {
            const cellText = String(cell);
            // Truncate if too long
            const maxWidth = colWidths[i] - 4;
            const textWidth = doc.getTextWidth(cellText);
            let displayText = cellText;
            if (textWidth > maxWidth) {
              let truncated = cellText;
              while (doc.getTextWidth(truncated + '...') > maxWidth && truncated.length > 0) {
                truncated = truncated.substring(0, truncated.length - 1);
              }
              displayText = truncated + '...';
            }
            
            // Color coding for Result column (column 4)
            if (i === 4) {
              if (/win/i.test(result)) {
                doc.setTextColor(16, 185, 129); // --green: #10b981
              } else if (/loss/i.test(result)) {
                doc.setTextColor(239, 68, 68); // --red: #ef4444
              } else {
                doc.setTextColor(107, 114, 128); // --text-dim for breakeven
              }
            }
            // Color coding for P&L column (column 5)
            else if (i === 5 && pnlNum !== null && Number.isFinite(pnlNum)) {
              if (pnlNum > 0) {
                doc.setTextColor(16, 185, 129); // --green: #10b981
              } else if (pnlNum < 0) {
                doc.setTextColor(239, 68, 68); // --red: #ef4444
              } else {
                doc.setTextColor(17, 24, 39); // --text
              }
            } else {
              doc.setTextColor(17, 24, 39); // --text: #111827
            }
            
            doc.text(displayText, xPos + 4, yPos);
            xPos += colWidths[i];
          });

          // Reset text color
          doc.setTextColor(17, 24, 39);
          yPos += rowHeight;
          currentPageRowCount++;
        });

        // Summary at the end
        const totalTrades = data.length;
        const wins = data.filter(t => /win/i.test(t.result || '')).length;
        const losses = data.filter(t => /loss/i.test(t.result || '')).length;
        const breakevens = data.filter(t => /breakeven/i.test(t.result || '')).length;
        const totalPnl = data.reduce((sum, t) => {
          const pnl = t.pnl;
          const pnlNum = (pnl != null && pnl !== '') ? (typeof pnl === 'number' ? pnl : parseFloat(String(pnl).replace(',', '.'))) : null;
          return sum + (pnlNum != null && Number.isFinite(pnlNum) ? pnlNum : 0);
        }, 0);

        // Add new page for summary if needed
        if (yPos + 45 > pageHeight - margin) {
          doc.addPage();
          yPos = startY;
        } else {
          yPos += 15;
        }

        // Summary box - matching website card style (--surface: #ffffff, --border: #e1e8ed)
        // Calculate required height: title (8mm) + spacing (2mm) + 4 lines (7mm each) + spacing (3mm) + total P&L (6mm) = 44mm
        const summaryHeight = 45;
        const summaryStartY = yPos - 3;
        doc.setFillColor(255, 255, 255); // --surface: #ffffff
        doc.setDrawColor(225, 232, 237); // --border: #e1e8ed
        doc.setLineWidth(0.5);
        // Rounded rectangle matching --radius-lg: 16px (approximately 4mm)
        doc.roundedRect(margin, summaryStartY, pageWidth - 2 * margin, summaryHeight, 4, 4, 'FD');
        
        // Summary title - matching website h2 style
        doc.setFontSize(16);
        doc.setFont(undefined, 'bold');
        doc.setTextColor(17, 24, 39); // --text: #111827
        doc.text('Summary', margin + 8, summaryStartY + 8);
        
        doc.setFontSize(10);
        doc.setFont(undefined, 'normal');
        
        // Calculate win rate
        const winRate = totalTrades > 0 ? ((wins / totalTrades) * 100).toFixed(1) : 0;
        
        const summaryLeft = margin + 8;
        const summaryRight = margin + (pageWidth - 2 * margin) / 2 + 8;
        let summaryY = summaryStartY + 18;
        
        // Total Trades
        doc.setTextColor(17, 24, 39); // --text
        doc.text(`Total Trades: ${totalTrades}`, summaryLeft, summaryY);
        doc.setTextColor(16, 185, 129); // --green
        doc.text(`Wins: ${wins}`, summaryRight, summaryY);
        summaryY += 7;
        
        // Win Rate and Losses
        doc.setTextColor(107, 114, 128); // --text-dim
        doc.text(`Win Rate: ${winRate}%`, summaryLeft, summaryY);
        doc.setTextColor(239, 68, 68); // --red
        doc.text(`Losses: ${losses}`, summaryRight, summaryY);
        summaryY += 7;
        
        // Breakevens
        doc.setTextColor(107, 114, 128); // --text-dim
        doc.text(`Breakevens: ${breakevens}`, summaryLeft, summaryY);
        summaryY += 8;
        
        // Total P&L - bold and colored
        doc.setFont(undefined, 'bold');
        doc.setFontSize(12);
        const pnlColor = totalPnl >= 0 ? [16, 185, 129] : [239, 68, 68];
        doc.setTextColor(pnlColor[0], pnlColor[1], pnlColor[2]);
        doc.text(`Total P&L: ${totalPnl >= 0 ? '+' : ''}${totalPnl.toFixed(2)}$`, summaryLeft, summaryY);

        // Generate filename
        const filename = `tradelog_${new Date().toISOString().split('T')[0]}.pdf`;
        
        // Save PDF
        doc.save(filename);
        showToast('PDF exported successfully', { duration: 3000, type: 'success' });
      } catch (e) {
        console.error('Export error:', e);
        showToast('Failed to export PDF. Please try again.', { duration: 4000 });
      }
    }

    document.addEventListener('click', function (e) {
      const shot = e.target && e.target.closest && e.target.closest('button.shot-link');
      if (shot) {
        e.preventDefault();
        const enc = shot.getAttribute('data-url') || '';
        handleScreenshotOpen(enc);
        return;
      }
      const noteA = e.target && e.target.closest && e.target.closest('button.note-link');
      if (noteA) {
        e.preventDefault();
        const enc = noteA.getAttribute('data-note') || '';
        try { const note = decodeURIComponent(enc || ''); openNoteModal(note); } catch (err) { console.error('Cannot decode note', err); openNoteModal(enc || '—'); }
      }
    });

    function setPageTitleWithAnimation(newTitle) {
      const pageTitle = document.getElementById('pageTitle');
      if (!pageTitle) return;
      
      // Change text immediately
      pageTitle.textContent = newTitle;
      
      // Remove fade-in class to restart animation
      pageTitle.classList.remove('fade-in');
      
      // Trigger fade in
      requestAnimationFrame(() => {
        pageTitle.classList.add('fade-in');
      });
    }

    function navigateTo(route, push = true) {
      const navButtons = Array.from(document.querySelectorAll('.nav-btn'));
      navButtons.forEach(b => b.classList.remove('active'));
      const activeBtn = navButtons.find(b => b.dataset.route === route);
      if (activeBtn) activeBtn.classList.add('active');

      if (push && history && history.pushState) {
        try { history.pushState({ route }, '', route); } catch (e) { }
      }

      const pageContent = document.getElementById('pageContent');
      const hasContent = pageContent && pageContent.innerHTML.trim() !== '';

      // Always hide content before rendering new content
      if (pageContent) {
        pageContent.classList.remove('fade-in');
        pageContent.style.transition = 'none';
        pageContent.style.setProperty('opacity', '0', 'important');
        pageContent.style.setProperty('visibility', 'hidden', 'important');
      }

      // Use setTimeout to ensure styles are applied before rendering
      setTimeout(() => {
        // Render new content
        if (route === '/analytics') renderAnalyticsView();
        else if (route === '/calendar') renderCalendarView();
        else if (route === '/settings') renderSettingsView();
        else if (route === '/trades' || route === '/dashboard') renderTradesView();
        else renderTradesView();

        // Fade in after content is rendered - use multiple requestAnimationFrame to ensure DOM is updated
        if (hasContent) {
          // Wait for fade-out to complete before fading in (reduced delay for earlier appearance)
          setTimeout(() => {
            requestAnimationFrame(() => {
              requestAnimationFrame(() => {
              if (pageContent) {
                pageContent.style.transition = '';
                pageContent.style.removeProperty('opacity');
                pageContent.style.removeProperty('visibility');
                pageContent.classList.add('fade-in');
              }
              });
            });
          }, 300);
        } else {
          // Fade in after content is rendered (use triple requestAnimationFrame to ensure DOM is fully updated)
          requestAnimationFrame(() => {
            requestAnimationFrame(() => {
              requestAnimationFrame(() => {
              if (pageContent) {
                pageContent.style.transition = '';
                pageContent.style.removeProperty('opacity');
                pageContent.style.removeProperty('visibility');
                pageContent.classList.add('fade-in');
              }
              });
            });
          });
        }
      }, 0);
    }

    (function initNavigation() {
      const navButtons = Array.from(document.querySelectorAll('.nav-btn'));
      navButtons.forEach(btn => { btn.addEventListener('click', () => { const route = btn.dataset.route; navigateTo(route, true); }); });

      window.addEventListener('popstate', (e) => {
        const route = (e.state && e.state.route) || location.pathname || '/trades';
        navigateTo(route, false);
      });

      // Check URL parameters for email confirmation
      handleEmailConfirmation();
      
      // Check auth before initializing navigation
      checkAuth().then(isAuthenticated => {
        if (isAuthenticated) {
          const initial = (location.pathname === '/' ? '/trades' : location.pathname);
          navigateTo(initial, false);
        }
      });
    })();
    
    // Handle email confirmation from URL parameters and hash fragments
    function handleEmailConfirmation() {
      // Handle Supabase hash fragments (primary method - Supabase uses #access_token=...)
      if (window.location.hash) {
        const hash = window.location.hash.substring(1);
        const hashParams = new URLSearchParams(hash);
        const accessToken = hashParams.get('access_token');
        const type = hashParams.get('type');
        const error = hashParams.get('error');
        const errorDescription = hashParams.get('error_description');
        
        if (error) {
          // Handle error from hash
          let errorMsg = errorDescription || 'Email confirmation failed';
          setTimeout(() => {
            showToast(errorMsg, { duration: 5000 });
          }, 500);
          // Clean URL
          window.history.replaceState({}, '', window.location.pathname);
          return;
        }
        
        if (accessToken && (type === 'email' || type === 'signup' || !type)) {
          // Email confirmed via hash fragment
          localStorage.setItem('auth_token', accessToken);
          authToken = accessToken;
          setTimeout(() => {
            showToast('Email confirmed successfully!', { duration: 5000, type: 'success' });
            // Reload to get user info
            checkAuth().then(isAuthenticated => {
              if (isAuthenticated) {
                navigateTo('/trades', false);
              }
            });
          }, 500);
          // Clean URL
          window.history.replaceState({}, '', window.location.pathname);
          return;
        }
      }
      
      // Handle query parameters (fallback method)
      const urlParams = new URLSearchParams(window.location.search);
      const emailConfirmed = urlParams.get('email_confirmed');
      const token = urlParams.get('token');
      const error = urlParams.get('error');
      
      // Handle email confirmation success
      if (emailConfirmed === 'true') {
        if (token) {
          // Store token and log in
          localStorage.setItem('auth_token', token);
          authToken = token;
          setTimeout(() => {
            checkAuth().then(isAuthenticated => {
              if (isAuthenticated) {
                navigateTo('/trades', false);
              }
            });
          }, 100);
        }
        // Show success message
        setTimeout(() => {
          showToast('Email confirmed successfully! You can now log in.', { duration: 5000, type: 'success' });
        }, 500);
        // Clean URL
        window.history.replaceState({}, '', window.location.pathname);
      }
      
      // Handle errors from query params
      if (error) {
        let errorMsg = 'An error occurred';
        if (error === 'invalid_confirmation_link') {
          errorMsg = 'Invalid confirmation link';
        } else if (error === 'confirmation_failed') {
          errorMsg = 'Email confirmation failed. The link may have expired.';
        }
        setTimeout(() => {
          showToast(errorMsg, { duration: 5000 });
        }, 500);
        // Clean URL
        window.history.replaceState({}, '', window.location.pathname);
      }
    }

    (function attachBackdropClose() {
      const modalBackdrop = document.getElementById('modalBackdrop');
      const noteBackdropEl = document.getElementById('noteModalBackdrop');
      function onBackdropClick(e, closeFn) { if (e.target === e.currentTarget) closeFn(); }
      if (modalBackdrop) { modalBackdrop.addEventListener('click', (e) => onBackdropClick(e, closeAddModal)); modalBackdrop.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeAddModal(); }); }
      if (noteBackdropEl) { noteBackdropEl.addEventListener('click', (e) => onBackdropClick(e, closeNoteModal)); noteBackdropEl.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeNoteModal(); }); }
    })();

    function updateSubtitleToToday() {
      const el = document.getElementById('pageSubtitle'); if (!el) return;
      const now = new Date();
      const opts = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric', timeZone: 'Europe/Warsaw' };
      el.textContent = now.toLocaleDateString('en-GB', opts);
    }

    document.addEventListener('DOMContentLoaded', () => { updateSubtitleToToday(); });

    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') { const b = document.getElementById('modalBackdrop'); if (b && b.style.display === 'flex') closeAddModal(); const nb = document.getElementById('noteModalBackdrop'); if (nb && nb.style.display === 'flex') closeNoteModal(); } });

    function getCalendarState() {
      const yEl = document.getElementById('yearSelect');
      const mEl = document.getElementById('monthSelect');
      const now = new Date();
      return { year: yEl ? parseInt(yEl.value, 10) : now.getFullYear(), month: mEl ? parseInt(mEl.value, 10) : now.getMonth() };
    }

    // Attach event listeners to buttons (CSP compliant - no inline handlers)
    function switchToSignup() {
      const loginContainer = document.getElementById('loginContainer');
      const signupContainer = document.getElementById('signupContainer');
      if (loginContainer) loginContainer.classList.add('hidden');
      if (signupContainer) signupContainer.classList.remove('hidden');
      // Clear errors
      const loginError = document.getElementById('loginError');
      const signupError = document.getElementById('signupError');
      if (loginError) {
        loginError.textContent = '';
        loginError.style.display = 'none';
      }
      if (signupError) {
        signupError.textContent = '';
        signupError.style.display = 'none';
      }
    }

    function switchToLogin() {
      const loginContainer = document.getElementById('loginContainer');
      const signupContainer = document.getElementById('signupContainer');
      if (signupContainer) signupContainer.classList.add('hidden');
      if (loginContainer) loginContainer.classList.remove('hidden');
      // Clear errors
      const loginError = document.getElementById('loginError');
      const signupError = document.getElementById('signupError');
      if (loginError) {
        loginError.textContent = '';
        loginError.style.display = 'none';
      }
      if (signupError) {
        signupError.textContent = '';
        signupError.style.display = 'none';
      }
    }

    function attachEventListeners() {
      // Login/Signup buttons
      const loginBtn = document.getElementById('loginBtn');
      if (loginBtn) loginBtn.addEventListener('click', handleLogin);
      
      const signupBtn = document.getElementById('signupBtn');
      if (signupBtn) signupBtn.addEventListener('click', handleSignup);

      // Switch between login and signup
      const switchToSignupBtn = document.getElementById('switchToSignupBtn');
      if (switchToSignupBtn) switchToSignupBtn.addEventListener('click', switchToSignup);

      const switchToLoginBtn = document.getElementById('switchToLoginBtn');
      if (switchToLoginBtn) switchToLoginBtn.addEventListener('click', switchToLogin);
      
      // Logout button
      const logoutBtn = document.getElementById('logoutBtn');
      if (logoutBtn) logoutBtn.addEventListener('click', handleLogout);
      
      // New Trade buttons (static and dynamic)
      const newTradeBtn = document.getElementById('newTradeBtn');
      if (newTradeBtn) newTradeBtn.addEventListener('click', openAddModal);
      
      // Use event delegation for dynamically added buttons
      document.addEventListener('click', (e) => {
        if (e.target && e.target.id === 'newTradeBtnHeader') {
          openAddModal();
        }
        if (e.target && (e.target.id === 'exportPdfBtn' || e.target.closest('#exportPdfBtn'))) {
          exportTradesToPDF();
        }
      });
      
      // Modal buttons
      const cancelModalBtn = document.getElementById('cancelModalBtn');
      if (cancelModalBtn) cancelModalBtn.addEventListener('click', closeAddModal);
      
      const modalCloseX = document.getElementById('modalCloseX');
      if (modalCloseX) modalCloseX.addEventListener('click', closeAddModal);
      
      const submitTradeBtn = document.getElementById('submitTradeBtn');
      if (submitTradeBtn) submitTradeBtn.addEventListener('click', submitTrade);
      
      // P&L input color coding
      const pnlInput = document.getElementById('pnlInput');
      if (pnlInput) {
        pnlInput.addEventListener('input', updatePnlColor);
        pnlInput.addEventListener('change', updatePnlColor);
      }
      
      // Settings buttons
      const saveColorBtn = document.getElementById('saveColorBtn');
      if (saveColorBtn) saveColorBtn.addEventListener('click', saveColorSettings);
      
      const resetColorBtn = document.getElementById('resetColorBtn');
      if (resetColorBtn) resetColorBtn.addEventListener('click', resetColorSettings);
      
      // Delete trade buttons (event delegation for dynamically generated buttons)
      document.addEventListener('click', (e) => {
        if (e.target && e.target.classList.contains('delete-trade-btn')) {
          const tradeId = e.target.getAttribute('data-trade-id');
          if (tradeId) {
            deleteTrade(parseInt(tradeId, 10));
          }
        }
      });
      
      // Edit trade buttons (event delegation for dynamically generated buttons)
      document.addEventListener('click', (e) => {
        if (e.target && e.target.classList.contains('edit-trade-btn')) {
          const tradeId = e.target.getAttribute('data-trade-id');
          if (tradeId) {
            openEditModal(parseInt(tradeId, 10));
          }
        }
      });
      
      // Convert initial selects to custom dropdowns
      setTimeout(() => convertSelectsToCustomDropdowns(), 100);
    }
    
    // Initialize event listeners when DOM is ready
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', attachEventListeners);
    } else {
      attachEventListeners();
    }
    
    // Keep functions on window for backward compatibility (if needed)
    window.openAddModal = openAddModal;
    window.closeAddModal = closeAddModal;
    window.submitTrade = submitTrade;
    window.deleteTrade = deleteTrade;
    window.handleScreenshotOpen = handleScreenshotOpen;
    window.renderAnalyticsView = renderAnalyticsView;
    window.renderTradesView = renderTradesView;
    window.renderCalendarView = renderCalendarView;
    window.renderSettingsView = renderSettingsView;
    window.saveColorSettings = saveColorSettings;
    window.resetColorSettings = resetColorSettings;
    window.openNoteModal = openNoteModal;
    window.closeNoteModal = closeNoteModal;
    
    // Initialize colors and theme on page load
    loadColorSettings();
    loadTheme();
  </script>
</body>

</html>
